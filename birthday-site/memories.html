<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little Archive — Memories</title>
<meta name="description" content="A little corner of the internet built for someone we love.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,300;0,400;1,300;1,400&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ctext y=%2226%22 font-size=%2226%22%3E%F0%9F%A4%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="memories.html">
<main class="shell">
  <header class="page-head reveal">
    <span class="label-caps eyebrow">Our little archive</span>
    <h1 class="display-lg">Memories</h1>
    <p class="note">Loose photographs, in no particular order, the way a shoebox keeps them.</p>
  </header>

  <section class="reveal">
    <div class="memory-grid" id="memory-grid">
      <figure class="polaroid is-empty" style="transform:rotate(-2deg)">
        <div class="frame"><span class="material-symbols-outlined">image</span></div>
        <figcaption class="caption">…</figcaption>
      </figure>
      <figure class="polaroid is-empty" style="transform:rotate(1.5deg)">
        <div class="frame"><span class="material-symbols-outlined">image</span></div>
        <figcaption class="caption">…</figcaption>
      </figure>
      <figure class="polaroid is-empty" style="transform:rotate(-1deg)">
        <div class="frame"><span class="material-symbols-outlined">image</span></div>
        <figcaption class="caption">…</figcaption>
      </figure>
    </div>

    <div class="placeholder" style="margin-top:32px">
      <span class="material-symbols-outlined">photo_library</span>
      <p class="headline-md" style="font-size:20px">Waiting for the photographs</p>
      <p class="body-sm">Drop the pictures into <code>assets/img/photos/</code> and they'll fill
         this wall as tilted polaroids, each with its own caption.</p>
    </div>
  </section>
</main>
<script src="assets/js/content.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/pages/memories.js"></script>
</body>
</html>
