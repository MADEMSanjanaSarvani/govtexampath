  <div class="rule reveal"><span class="material-symbols-outlined">mood</span></div>

    <h2 class="headline-md" style="margin-bottom:20px">The incidents</h2>
    <div class="grid grid-2" id="jokes-grid"></div>
    <div class="placeholder" id="jokes-placeholder">
      <span class="material-symbols-outlined">sentiment_very_satisfied</span>
      <p class="body-sm">One card per story that still gets brought up at every dinner.</p>
