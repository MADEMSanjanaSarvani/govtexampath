name: Static Exam Content Verifier

# Closes a real gap: frontend/src/data/examsData.js (the 233-entry static
# fallback that ships as both the initial page state AND the offline/API-down
# fallback) sits entirely outside the AI verification that already covers the
# live MongoDB-backed exams (see daily-ai-verifier.yml, daily-official-verifier.yml).
# The only automated check it previously got was "is a past-deadline exam still
# marked open" (see exam-static-fallback-sync.yml). This workflow adds two more
# layers on top of that, specifically for examsData.js:
#
#   1. Mechanical audit (no AI, always runs, cheap) — catches self-contradictions
#      the data can have regardless of whether the facts are current: an
#      unhedged absolute claim ("X vacancies notified") on an exam flagged
#      tentative, or a dateStatus that disagrees with the exam's own
#      importantDates timeline. Findings are posted to a single tracking
#      GitHub Issue for a human to read — never auto-edited, since fixing
#      prose safely needs judgment a regex doesn't have.
#
#   2. AI-grounded batch verification (Gemini w/ Google Search grounding) —
#      checks a rotating batch of exams against their real current official
#      status, not just Gemini's static training knowledge. High-confidence
#      corrections to scalar fields (dateStatus/lastDate/vacancies/links) are
#      applied directly, matching the risk tolerance already used for the
#      live DB in daily-ai-verifier.yml. Anything lower-confidence goes to the
#      same tracking issue instead of being silently written.
#
# Batches rotate via .github/verification-state/static-exam-verify-state.json
# (oldest-verified-first) so all 233 entries cycle through over ~12 days.

on:
  schedule:
    - cron: '30 3 * * *' # 9:00 AM IST daily
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many exams to AI-verify this run'
        required: false
        default: '20'
        type: string

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mechanical audit + AI-grounded verification
        id: verify
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
        with:
          script: |
            const fs = require('fs');
            const path = 'frontend/src/data/examsData.js';
            const statePath = '.github/verification-state/static-exam-verify-state.json';
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];

            core.info(`\n${'═'.repeat(60)}`);
            core.info(`  Static Exam Content Verifier — ${todayStr}`);
            core.info(`${'═'.repeat(60)}\n`);

            let text = fs.readFileSync(path, 'utf8');

            function parseExams(t) {
              const m = /export const examsData = \[([\s\S]*)\];\s*$/.exec(t);
              if (!m) throw new Error('Could not locate examsData array in file');
              return eval('[' + m[1] + ']');
            }
            const exams = parseExams(text);
            core.info(`Loaded ${exams.length} exams from static fallback.`);

            // ── Block boundaries (each exam's slice of raw text, for safe field edits) ──
            const idRe = /_id:\s*'([^']+)'/g;
            let blocks = [];
            let m;
            while ((m = idRe.exec(text)) !== null) blocks.push({ id: m[1], start: m.index });
            for (let i = 0; i < blocks.length; i++) {
              blocks[i].end = (i + 1 < blocks.length) ? blocks[i + 1].start : text.length;
            }
            const blockById = Object.fromEntries(blocks.map(b => [b.id, b]));

            function applyFieldFix(id, field, value) {
              const block = blockById[id];
              if (!block) return false;
              const chunk = text.slice(block.start, block.end);
              const fieldRx = new RegExp(field + ": *'([^']*)'");
              const fm = fieldRx.exec(chunk);
              if (!fm) return false;
              const absStart = block.start + fm.index;
              const absEnd = absStart + fm[0].length;
              const escaped = String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
              text = text.slice(0, absStart) + `${field}: '${escaped}'` + text.slice(absEnd);
              // Recompute block offsets after every edit (lengths can shift)
              blocks = [];
              const idRe2 = /_id:\s*'([^']+)'/g;
              let mm;
              while ((mm = idRe2.exec(text)) !== null) blocks.push({ id: mm[1], start: mm.index });
              for (let i = 0; i < blocks.length; i++) {
                blocks[i].end = (i + 1 < blocks.length) ? blocks[i + 1].start : text.length;
              }
              Object.assign(blockById, Object.fromEntries(blocks.map(b => [b.id, b])));
              return true;
            }

            // ══════════════════════════════════════════════════════════════════
            // STEP 1 — Mechanical audit (no AI, deterministic, always safe)
            // ══════════════════════════════════════════════════════════════════
            core.info('── Step 1: Mechanical self-consistency audit ──');
            const mechanicalFindings = [];

            const UNHEDGED_PATTERNS = [
              /\b\d[\d,]*\+?\s+vacancies?\s+notified\b/i,
              /\bnotification\s+(?:has\s+been\s+|is\s+)?released\b/i,
              /\bofficially\s+announced\b/i,
            ];
            for (const exam of exams) {
              if (exam.dateStatus === 'tentative' && exam.description) {
                for (const rx of UNHEDGED_PATTERNS) {
                  if (rx.test(exam.description)) {
                    mechanicalFindings.push({
                      id: exam._id, title: exam.title,
                      issue: `Marked "tentative" but description makes an unhedged claim: "${exam.description.match(rx)[0]}"`,
                    });
                    break;
                  }
                }
              }
              // dateStatus vs its own importantDates: a "Notification Expected" entry
              // dated in the past while still tentative means the guess didn't pan out
              // and nobody update the record.
              if (exam.dateStatus === 'tentative' && Array.isArray(exam.importantDates)) {
                const expected = exam.importantDates.find(d => /expected/i.test(d.event || ''));
                if (expected && expected.date && new Date(expected.date) < today) {
                  const daysStale = Math.floor((today - new Date(expected.date)) / 86400000);
                  if (daysStale > 14) {
                    mechanicalFindings.push({
                      id: exam._id, title: exam.title,
                      issue: `"${expected.event}" was dated ${expected.date} (${daysStale} days ago) and never got a real update — still "tentative".`,
                    });
                  }
                }
              }
            }
            core.info(`Mechanical audit: ${mechanicalFindings.length} finding(s).`);

            // ══════════════════════════════════════════════════════════════════
            // STEP 2 — AI-grounded batch verification (rotating batch)
            // ══════════════════════════════════════════════════════════════════
            core.info('\n── Step 2: AI-grounded verification (Gemini + Google Search) ──');
            const geminiKey = process.env.GEMINI_API_KEY;
            const batchSize = parseInt(process.env.BATCH_SIZE, 10) || 20;

            let state = {};
            try { state = JSON.parse(fs.readFileSync(statePath, 'utf8')); } catch { state = {}; }

            const sorted = [...exams].sort((a, b) => {
              const aT = state[a._id] ? new Date(state[a._id]) : new Date(0);
              const bT = state[b._id] ? new Date(state[b._id]) : new Date(0);
              return aT - bT;
            });
            const toVerify = sorted.slice(0, batchSize);
            core.info(`Verifying ${toVerify.length}/${exams.length} exams this run (oldest-verified first, ~${Math.ceil(exams.length / batchSize)} days to cycle all).`);

            const aiFindings = [];
            let applied = 0, aiChecked = 0, aiFailed = 0;

            if (!geminiKey) {
              core.warning('GEMINI_API_KEY not configured — skipping AI-grounded verification, mechanical audit only.');
            } else {
              async function callGemini(prompt) {
                for (let attempt = 1; attempt <= 4; attempt++) {
                  const res = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${geminiKey}`,
                    {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        tools: [{ google_search: {} }],
                        generationConfig: { temperature: 0.1, maxOutputTokens: 1000 },
                      }),
                    }
                  );
                  if (res.ok) return res;
                  if (res.status === 429 && attempt < 4) {
                    await new Promise(r => setTimeout(r, attempt * 10000));
                    continue;
                  }
                  return res;
                }
              }

              for (const exam of toVerify) {
                aiChecked++;
                core.info(`\n[${aiChecked}/${toVerify.length}] ${exam.title}`);
                try {
                  const prompt = `You are verifying an Indian government exam listing against its REAL current status. Use Google Search grounding to check — do not rely on memorized knowledge alone, this needs to be current as of today.

            Exam: ${exam.title}
            Conducting Body: ${exam.conductingBody || 'not set'}
            Category: ${exam.category}
            Our data — Application Last Date: ${exam.lastDate || 'not set'}
            Our data — Date Status: ${exam.dateStatus || 'not set'}
            Our data — Vacancies: ${exam.vacancies || 'not set'}
            Our data — Official Website: ${exam.officialWebsite || 'not set'}

            Today's date: ${todayStr}

            Respond with ONLY this JSON (no markdown, no explanation outside the JSON):
            {
              "needsUpdate": true/false,
              "updates": {
                "lastDate": "YYYY-MM-DD or null",
                "dateStatus": "confirmed or tentative or closed or null",
                "vacancies": "exact official number as string, or null",
                "correctOfficialWebsite": "URL only if ours is dead/wrong, else null"
              },
              "confidence": "high/medium/low",
              "reason": "one sentence, cite what you found"
            }

            Rules:
            - Only set needsUpdate true if you found REAL, current, source-backed evidence something is wrong — not a guess.
            - dateStatus: "closed" if the application deadline has genuinely passed; "confirmed" if notification is out with firm dates; "tentative" only if truly not yet officially notified.
            - confidence "high" ONLY if you found a specific, current, credible source for the correction. Otherwise "low" and set needsUpdate false.
            - Leave a field null in updates if it doesn't need changing.`;

                  const res = await callGemini(prompt);
                  if (!res || !res.ok) { core.warning(`  Gemini error: ${res?.status}`); aiFailed++; await new Promise(r => setTimeout(r, 8000)); continue; }

                  const data = await res.json();
                  const text2 = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
                  const jsonMatch = text2.match(/\{[\s\S]*\}/);
                  if (!jsonMatch) { core.warning(`  No JSON in response for "${exam.title}"`); aiFailed++; continue; }

                  const v = JSON.parse(jsonMatch[0]);
                  state[exam._id] = today.toISOString();

                  if (!v.needsUpdate) { core.info(`  OK — no change needed.`); continue; }

                  if (v.confidence !== 'high') {
                    aiFindings.push({ id: exam._id, title: exam.title, issue: `(${v.confidence} confidence, not auto-applied) ${v.reason}` });
                    core.info(`  Low/medium confidence — queued for review, not auto-applied.`);
                    continue;
                  }

                  const u = v.updates || {};
                  const fieldsApplied = [];
                  if (u.lastDate) { if (applyFieldFix(exam._id, 'lastDate', u.lastDate)) fieldsApplied.push('lastDate'); }
                  if (u.dateStatus && ['confirmed', 'tentative', 'closed'].includes(u.dateStatus)) { if (applyFieldFix(exam._id, 'dateStatus', u.dateStatus)) fieldsApplied.push('dateStatus'); }
                  if (u.vacancies) { if (applyFieldFix(exam._id, 'vacancies', u.vacancies)) fieldsApplied.push('vacancies'); }
                  if (u.correctOfficialWebsite) {
                    if (applyFieldFix(exam._id, 'officialWebsite', u.correctOfficialWebsite)) fieldsApplied.push('officialWebsite');
                    if (applyFieldFix(exam._id, 'applicationLink', u.correctOfficialWebsite)) fieldsApplied.push('applicationLink');
                  }
                  if (fieldsApplied.length) {
                    applied++;
                    core.info(`  ✓ Applied: ${fieldsApplied.join(', ')} — ${v.reason}`);
                  }
                } catch (err) {
                  core.warning(`  Error verifying "${exam.title}": ${err.message}`);
                  aiFailed++;
                }
                await new Promise(r => setTimeout(r, 5000)); // gemini-2.0-flash free tier: 15 RPM
              }
            }

            fs.writeFileSync(path, text);
            fs.mkdirSync('.github/verification-state', { recursive: true });
            fs.writeFileSync(statePath, JSON.stringify(state, null, 2) + '\n');

            const allFindings = [...mechanicalFindings, ...aiFindings];
            core.setOutput('files_changed', applied > 0 ? 'true' : 'false');
            core.setOutput('findings_count', String(allFindings.length));
            fs.writeFileSync('/tmp/findings.json', JSON.stringify(allFindings));

            core.info(`\n${'═'.repeat(60)}`);
            core.info(`  Summary: ${applied} field(s) auto-fixed | ${aiChecked} AI-checked (${aiFailed} failed) | ${allFindings.length} flagged for review`);
            core.info(`${'═'.repeat(60)}\n`);

      - name: Commit auto-fixed data + verification state
        if: steps.verify.outputs.files_changed == 'true'
        run: |
          git config user.name "GovtExamPath Bot"
          git config user.email "noreply@govtexampath.com"
          git add frontend/src/data/examsData.js .github/verification-state/static-exam-verify-state.json
          git diff --staged --quiet -- frontend/src/data/examsData.js && echo "No data changes." || (
            git commit -m "fix: [auto-fix] AI-verified corrections to static exam fallback

          Automated by static-exam-content-verifier.yml. High-confidence
          corrections only — see the workflow run summary for details."
            git push
          )

      - name: Commit verification state only (no data changes)
        if: steps.verify.outputs.files_changed == 'false'
        run: |
          git config user.name "GovtExamPath Bot"
          git config user.email "noreply@govtexampath.com"
          git add .github/verification-state/static-exam-verify-state.json
          git diff --staged --quiet && echo "Nothing to commit." || (
            git commit -m "chore: [auto-fix] update static exam verification state"
            git push
          )

      - name: Trigger Firebase frontend rebuild
        if: steps.verify.outputs.files_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'firebase-deploy.yml', ref: 'main',
              });
              core.info('✓ Firebase deploy triggered.');
            } catch (err) {
              core.warning(`Could not trigger Firebase deploy: ${err.message}`);
            }

      - name: Post findings to tracking issue
        if: steps.verify.outputs.findings_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const findings = JSON.parse(fs.readFileSync('/tmp/findings.json', 'utf8'));
            if (!findings.length) return;

            const TITLE = '📋 Static exam data — needs human review';
            const body = [
              `Automated findings from the **Static Exam Content Verifier** as of ${new Date().toISOString().split('T')[0]}.`,
              '',
              'These were NOT auto-applied — either they need a human judgment call (e.g. wording, not a scalar field), or the AI confidence was medium/low.',
              '',
              ...findings.map(f => `- **${f.title}** (\`${f.id}\`): ${f.issue}`),
              '',
              '_This issue is updated (not duplicated) by every run — resolved items should be cleared here once you fix or dismiss them._',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'automated-data-review',
            });
            const existing = issues.find(i => i.title === TITLE);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              core.info(`Updated existing issue #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: ['automated-data-review'],
              });
              core.info(`Created issue #${created.data.number}.`);
            }
