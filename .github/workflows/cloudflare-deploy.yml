name: Deploy Frontend to Cloudflare Pages

# Same build as firebase-deploy.yml, published to Cloudflare Pages instead.
#
# WHY THIS EXISTS
# Firebase Hosting on the free Spark plan caps outbound transfer at 360 MB/day,
# and going over takes the site offline until the quota resets rather than
# billing for the overage. Cloudflare Pages is free with no bandwidth cap, and
# the frontend is already a static export (`output: 'export'`), so it is the
# same artifact either way. Firebase stays on Spark for Authentication and
# Cloud Messaging, both of which are free and unaffected by this.
#
# MIGRATION ORDER — deliberately overlapping.
# This workflow runs alongside firebase-deploy.yml on purpose. Firebase keeps
# serving live traffic on govtexampath.com while this publishes to a
# *.pages.dev URL, so the new host can be verified against real content before
# any DNS changes. Only after that should DNS move; only after DNS has settled
# should Firebase Hosting be retired and the project dropped to Spark. Deleting
# firebase-deploy.yml before then would leave the live domain frozen on
# whatever build happened to be current.
#
# Redirects and headers are NOT read from firebase.json here — Cloudflare reads
# frontend/public/_redirects and frontend/public/_headers, which are ported
# copies. A change to one must be mirrored in the other until Firebase Hosting
# is retired.

# MANUAL TRIGGER ONLY, on purpose.
#
# Firebase Hosting is still the live host and measured transfer is ~140 MB/day
# against the 360 MB/day Spark cap, so there is nothing to migrate yet. Running
# this on push would fail on every commit until Cloudflare secrets exist, which
# is noise for a move that may never be needed.
#
# When the time comes: add the secrets, run this by hand, check the *.pages.dev
# URL, and only then add the push/schedule triggers that firebase-deploy.yml
# currently owns.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Checked before the build, not after. wrangler only reports the missing
      # token once it runs, which meant paying a full npm ci + Next build first
      # and then failing with an error that does not name the repository
      # secret it actually wants.
      - name: Check Cloudflare credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MISSING=""
          [ -n "$CF_TOKEN" ]   || MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Cloudflare is not set up yet. Missing repository secret(s):$MISSING"
            {
              echo "### Cloudflare not configured"
              echo ""
              echo "Missing repository secret(s):\`$MISSING\`"
              echo ""
              echo "This workflow is optional. Firebase Hosting is still serving the site,"
              echo "and current usage is well inside the free tier, so nothing is broken."
              echo ""
              echo "To enable it: create a Cloudflare API token with"
              echo "\`Account -> Cloudflare Pages -> Edit\`, then add it plus the account id"
              echo "under Settings -> Secrets and variables -> Actions."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Cloudflare credentials present."

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify environment variables
        run: |
          if [ -z "$GCID" ]; then
            echo "::error::NEXT_PUBLIC_GOOGLE_CLIENT_ID secret is empty!"
            exit 1
          fi
          echo "GOOGLE_CLIENT_ID length: ${#GCID}"
        env:
          GCID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://govtexampath-backend.onrender.com/api' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
          # Exempts the build from the API's IP rate limiter. getStaticProps runs
          # once per exam (~700 calls in under a minute) and was exceeding the
          # 300-per-15-minutes cap partway through, so the rest of the pages were
          # built from 429s. Not NEXT_PUBLIC, so it stays out of the client bundle.
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
        run: npm run build

      # Next copies public/ into out/ verbatim. If these are missing the deploy
      # still succeeds but silently drops every redirect and the COOP header
      # that Google Sign-In depends on, so fail loudly here instead.
      - name: Verify routing config reached the build output
        working-directory: frontend
        run: |
          MISSING=0
          for f in _redirects _headers .well-known/assetlinks.json; do
            if [ ! -f "out/$f" ]; then
              echo "::error::out/$f is missing from the build output"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1
          echo "Pages built: $(find out -name '*.html' | wc -l) HTML files"

      # --branch is what decides production vs preview on Cloudflare Pages: a
      # deploy whose branch matches the project's production branch goes live,
      # anything else gets its own preview URL. So this must be the real branch
      # name -- hardcoding 'main' would publish every claude/** build straight
      # to the live domain, which is exactly the behaviour being removed from
      # the Firebase workflow alongside this.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: >-
            pages deploy out
            --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'govtexampath' }}
            --branch=${{ github.ref_name }}
