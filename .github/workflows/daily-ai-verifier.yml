name: Hourly AI Exam Verifier

on:
  schedule:
    # Four times a day, not hourly. The hourly schedule was a bet that the Gemini limit was
    # per-minute; the comment here used to admit it might be a daily quota instead, in which
    # case the extra runs buy nothing. Measurement settled it: this verifier was consuming the
    # shared free-tier quota and starving the Daily Official-Source Verifier, which on
    # 2026-08-17 failed 10 of 12 exams with gemini_rate_limit while only 2 failed to fetch.
    #
    # That trade was backwards. This workflow asks Gemini what it already believes about an
    # exam; the official-source verifier fetches that exam's real government page and compares
    # against it. The weaker signal was crowding out the stronger one — and it wasn't even
    # cashing in the quota it took: recent runs completed 5/100 and 32/100 before the circuit
    # breaker fired, so hourly runs at batch 100 were mostly buying 429s.
    #
    # 24 runs x 100 was up to 2400 calls/day; 4 x 40 is up to 160, which leaves real headroom
    # for the official-source verifier's 15.
    #
    # Cutting the volume was not sufficient on its own: the official-source pass still hit
    # 10 x gemini_rate_limit on 2026-08-18 because it ran at 22:30, last in the day. Order
    # matters as much as volume against a daily quota, so these now start at 09:00 UTC —
    # after that pass moves to 07:15, just past the 07:00 UTC (midnight Pacific) reset. The
    # higher-fidelity check draws from fresh quota first; this one takes what remains.
    - cron: '0 9,13,17,21 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  verify:
    runs-on: ubuntu-latest
    # 30 min wasn't enough (every run was getting killed mid-batch), and neither was the first
    # bump to 55 — a run on 2026-07-31 still got cancelled at exactly ~55 minutes. 100 exams at a
    # minimum 5s pace between calls is 8+ minutes on its own, and Gemini free-tier 429 retry
    # backoff (up to 60s per attempt, up to 6 attempts, potentially on every exam in the batch on
    # a bad day) makes true worst-case runtime unpredictable. Giving this a much larger ceiling
    # instead of guessing again — it only costs extra CI minutes if it's actually needed.
    timeout-minutes: 170
    steps:
      - name: AI-verify batch of active exams
        uses: actions/github-script@v7
        env:
          API_URL: ${{ secrets.API_URL }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const apiUrl = process.env.API_URL;
            const botKey = process.env.BOT_API_KEY;
            const geminiKey = process.env.GEMINI_API_KEY;

            if (!apiUrl || !botKey || !geminiKey) {
              core.setFailed('Missing required secrets (API_URL, BOT_API_KEY, GEMINI_API_KEY)');
              return;
            }

            const fetchRes = await fetch(`${apiUrl}/api/bot/exams?active=true`, {
              headers: { 'x-bot-api-key': botKey }
            });

            if (!fetchRes.ok) {
              core.setFailed(`Failed to fetch exams: ${fetchRes.status}`);
              return;
            }

            const response = await fetchRes.json();
            const exams = response.data || response;

            if (exams.length === 0) {
              core.info('No active exams to verify.');
              return;
            }

            // Process 40 exams per run, prioritized by risk then staleness. Gemini's
            // free-tier rate limit means most runs only get through a fraction of the
            // batch before hitting 429s and stopping early (see the retry-exhaustion
            // handling below) — so pure oldest-verified-first order was spending that
            // scarce real capacity essentially at random, giving a long-closed exam
            // the same priority as a tentative one whose notification could land any
            // day. Tentative (least certain, most likely to need a real update) goes
            // first, then confirmed, then closed (least likely to have new info) last
            // — staleness is still the tiebreaker within each tier.
            const BATCH_SIZE = 40;
            const now = new Date();
            const RISK_RANK = { tentative: 0, confirmed: 1, closed: 2 };
            const sorted = exams.sort((a, b) => {
              const rankDiff = (RISK_RANK[a.dateStatus] ?? 1) - (RISK_RANK[b.dateStatus] ?? 1);
              if (rankDiff !== 0) return rankDiff;
              const aDate = a.lastVerifiedAt ? new Date(a.lastVerifiedAt) : new Date(0);
              const bDate = b.lastVerifiedAt ? new Date(b.lastVerifiedAt) : new Date(0);
              return aDate - bDate;
            });
            const toVerify = sorted.slice(0, BATCH_SIZE);

            core.info(`Total active exams: ${exams.length} | Verifying batch of ${toVerify.length} this run (tentative first, then confirmed, then closed; oldest-verified within each tier).`);

            let verified = 0;
            let updated = 0;
            let failed = 0;

            async function callGemini(prompt) {
              for (let attempt = 1; attempt <= 6; attempt++) {
                const res = await fetch(
                  `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${geminiKey}`,
                  {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      contents: [{ parts: [{ text: prompt }] }],
                      generationConfig: { temperature: 0.1, maxOutputTokens: 800 }
                    })
                  }
                );
                if (res.ok) return res;
                if (res.status === 429 && attempt < 6) {
                  const wait = attempt * 10000;
                  core.info(`  Rate limited (429). Waiting ${wait/1000}s before retry ${attempt+1}/6...`);
                  await new Promise(r => setTimeout(r, wait));
                  continue;
                }
                return res;
              }
            }

            // If Gemini's quota is exhausted for the day (rather than just transient contention),
            // every remaining exam will hit the same wall after burning through all 6 retries each
            // (10s+20s+30s+40s+50s = 150s wasted per exam) — a run on 2026-08-01 spent 2h50m
            // hitting 429 on every single exam from #61 onward before the timeout killed it,
            // completing only 62/100. Stop early after a run of consecutive full-retry failures
            // instead of burning the rest of the timeout budget on guaranteed failures.
            let consecutiveRateLimitFailures = 0;
            const MAX_CONSECUTIVE_RATE_LIMIT_FAILURES = 5;

            for (let i = 0; i < toVerify.length; i++) {
              const exam = toVerify[i];
              core.info(`\n[${i+1}/${toVerify.length}] Verifying: ${exam.title} (last verified: ${exam.lastVerifiedAt || 'never'})`);

              try {
                const prompt = `You are a government exam data verification assistant for Indian government exams. Verify the following exam data and provide ONLY a JSON response.

            Exam: ${exam.title}
            Category: ${exam.category}
            Current Last Date: ${exam.lastDate || 'not set'}
            Current Date Status: ${exam.dateStatus || 'not set'}
            Conducting Body: ${exam.conductingBody || 'not set'}
            Vacancies: ${exam.vacancies || 'not set'}

            Today's date: ${now.toISOString().split('T')[0]}

            Respond with ONLY this JSON format (no markdown, no code blocks, no explanation):
            {
              "needsUpdate": true/false,
              "updates": {
                "lastDate": "YYYY-MM-DD or null if no change",
                "dateStatus": "confirmed or tentative or closed",
                "vacancies": "number as string or null if no change",
                "description": "updated one-line description or null if no change"
              },
              "confidence": "high/medium/low",
              "reason": "brief explanation"
            }

            Rules:
            - Only set needsUpdate to true if you are CONFIDENT the data needs updating based on your knowledge
            - dateStatus MUST be exactly one of: "confirmed", "tentative", or "closed" — no other values
            - If the application last date has passed, set dateStatus to "closed" — but do NOT set isActive — the exam may still be ongoing (exam dates, results still pending)
            - Only include fields in updates that actually need changing; use null for fields with no change
            - If unsure about any date, set confidence to "low" and needsUpdate to false
            - For vacancies, only include if you have the exact official number
            - Do NOT guess dates — only include lastDate if you have high confidence in the exact date`;

                const geminiRes = await callGemini(prompt);

                if (!geminiRes || !geminiRes.ok) {
                  core.warning(`Gemini API error for "${exam.title}": ${geminiRes?.status || 'no response'}`);
                  failed++;
                  if (geminiRes?.status === 429) {
                    consecutiveRateLimitFailures++;
                    if (consecutiveRateLimitFailures >= MAX_CONSECUTIVE_RATE_LIMIT_FAILURES) {
                      core.warning(`\n${consecutiveRateLimitFailures} exams in a row exhausted all retries on 429 — Gemini's quota looks exhausted for now. Stopping early instead of burning the rest of the timeout budget on guaranteed failures. ${toVerify.length - i - 1} exams will be picked up on the next run (oldest-verified-first ordering means they won't be skipped forever).`);
                      break;
                    }
                  } else {
                    consecutiveRateLimitFailures = 0;
                  }
                  await new Promise(r => setTimeout(r, 15000));
                  continue;
                }
                consecutiveRateLimitFailures = 0;

                const geminiData = await geminiRes.json();
                const text = geminiData.candidates?.[0]?.content?.parts?.[0]?.text || '';

                const jsonMatch = text.match(/\{[\s\S]*\}/);
                if (!jsonMatch) {
                  core.warning(`No valid JSON in Gemini response for "${exam.title}"`);
                  failed++;
                  continue;
                }

                const verification = JSON.parse(jsonMatch[0]);
                core.info(`  AI result: needsUpdate=${verification.needsUpdate}, confidence=${verification.confidence}, reason=${verification.reason}`);

                if (!verification.needsUpdate || verification.confidence === 'low') {
                  await fetch(`${apiUrl}/api/bot/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-bot-api-key': botKey },
                    body: JSON.stringify({
                      title: exam.title,
                      category: exam.category,
                      updates: {},
                      source: 'gemini-ai-verifier'
                    })
                  });
                  core.info(`  Marked as verified (no changes needed)`);
                  verified++;
                } else {
                  const updates = verification.updates || {};
                  for (const key of Object.keys(updates)) {
                    if (updates[key] === null || updates[key] === undefined) delete updates[key];
                  }

                  const updateRes = await fetch(`${apiUrl}/api/bot/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-bot-api-key': botKey },
                    body: JSON.stringify({
                      title: exam.title,
                      category: exam.category,
                      updates,
                      source: 'gemini-ai-verifier'
                    })
                  });

                  if (updateRes.ok) {
                    const result = await updateRes.json();
                    core.info(`  Updated: ${JSON.stringify(result.data?.fieldsUpdated || [])}`);
                    updated++;
                  } else {
                    core.warning(`  Update failed: ${updateRes.status}`);
                    failed++;
                  }
                }

                // 5s pause between exams (gemini-flash-latest free tier: ~15 RPM = 1 every 4s)
                await new Promise(r => setTimeout(r, 5000));

              } catch (err) {
                core.warning(`Error verifying "${exam.title}": ${err.message}`);
                failed++;
              }
            }

            core.info(`\n=== VERIFICATION COMPLETE ===`);
            core.info(`Batch size: ${toVerify.length} | Attempted: ${verified + updated + failed} | Verified: ${verified} | Updated: ${updated} | Failed: ${failed}`);
