name: One-off - Remap Dead Official Domains

# Rewrites officialWebsite / applicationLink for hosts that are confirmed dead,
# where the same body serves the same content from a different domain. Only the
# hostname changes; path and query are preserved.
#
# THE BAR FOR ADDING AN ENTRY HERE IS DELIBERATELY HIGH.
#
# The Dead Official Link Audit reports far more unreachable hosts than belong in
# this table, and its first two reports were largely wrong — it called
# upsc.gov.in dead across 24 exams twice, once because of strict TLS and once
# because it counted a timeout as death. Rewriting a URL on that evidence would
# have replaced correct data with a guess, which is worse than the dead link.
# So an entry needs all three:
#
#   1. Unreachable from at least two independent networks, one of them a real
#      browser in India, since some government hosts refuse foreign traffic.
#   2. A failure that proves absence — no DNS, or connection refused. A timeout
#      does not qualify on its own; it has to be reproduced from India too.
#   3. The replacement demonstrably serving the same body's content, not a
#      plausible-looking guess.
#
# ssc.nic.in is the only host that has cleared it:
#   - dead-link audit from GitHub runners: ETIMEDOUT across 11 exam links
#   - official-source verifier from GitHub runners: ECONNABORTED
#   - Chrome in India: ERR_CONNECTION_TIMED_OUT
#   - ssc.gov.in is fetched successfully by the verifier on every run, and is
#     the host all 32 SSC links in the static catalogue already use, so the
#     replacement is what this project already treats as correct elsewhere
#     rather than something inferred here.
#
# INVESTIGATED AND REJECTED — do not add these without new evidence.
#
# The 26 Aug audit (the first to cover all 283 URLs) reported a railway cluster
# as unreachable: rrbapply.gov.in, rrbcdg.gov.in, indianrailways.gov.in and four
# of its subdomains, plus rlda.gov.in and rac.gov.in — over 20 exam links. It
# also reported tspsc.gov.in and www.tspsc.gov.in dead, 6 more.
#
# A cluster that size looks like one domain reorganisation with one obvious
# replacement, which is exactly why it is worth writing down that it is not.
# Requirement 3 above fails: there is no replacement this project already treats
# as correct. The hand-maintained static catalogue uses the same hosts the audit
# calls dead — www.rrbcdg.gov.in on 15 exams, www.rrbapply.gov.in on 1,
# tspsc.gov.in on 6, www.tspsc.gov.in on 2. Both catalogues agree, so this is not
# a case of the database holding stale URLs.
#
# A later browser check narrowed this and is worth recording. From India:
# rrbcdg.gov.in resolves and returns an F5 "Request Rejected" page, so the domain
# is alive and its WAF refuses the request — real users hit that same page, which
# makes its 25 links a dead end that changing the hostname would not fix.
# tgpsc.gov.in exists and serves with an expired certificate
# (ERR_CERT_DATE_INVALID), consistent with Telangana renaming TSPSC to TGPSC,
# making it the likely replacement for the tspsc.gov.in links — though an expired
# certificate is also exactly what makes an automated checker reject a live site,
# so confirm before trusting it.
#
# That leaves two possibilities, and this job cannot tell them apart: the hosts
# are genuinely down, or an Indian government host is refusing a US-based GitHub
# runner. ECONNREFUSED is stronger than a timeout, but a firewall answering
# foreign traffic with a TCP RST produces the same signature. Requirement 1 —
# two independent networks, one a real browser in India — is what settles it.
#
# Until someone checks from India, remapping these would rewrite 20+ links on
# the say-so of a single vantage point, which is the mistake that made this
# audit's first three reports wrong.

# Manual trigger only, and safe to run repeatedly — once a URL is remapped it no
# longer matches, so a second run reports nothing to do.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remap confirmed-dead hostnames
        uses: actions/github-script@v7
        env:
          API_URL: ${{ secrets.API_URL }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
        with:
          script: |
            const apiUrl = process.env.API_URL;
            const botKey = process.env.BOT_API_KEY;
            if (!apiUrl || !botKey) {
              core.setFailed('Missing API_URL or BOT_API_KEY');
              return;
            }

            // hostname -> replacement hostname. See the bar documented above.
            const REMAP = {
              'ssc.nic.in': 'ssc.gov.in',
              'www.ssc.nic.in': 'ssc.gov.in',

              // The three below come from comparing the 26 Aug audit against
              // itself. Each dead host has a sibling in the SAME report, checked
              // from the same runner at the same moment, that demonstrably
              // exists — so the comparison is internal evidence rather than an
              // outside guess, which is what the earlier wrong remaps lacked.
              //
              // ENOTFOUND IS NOT ALWAYS PERMANENT — read this before adding more.
              //
              // On 26 Aug a browser in India returned NXDOMAIN for both
              // tspsc.gov.in and isro.gov.in, matching the audit. Twenty-three
              // minutes later the same phone loaded isro.gov.in perfectly. The
              // DNS failure was transient, so an ENOTFOUND in one run is not
              // evidence a domain is gone, and an earlier version of this comment
              // claiming the audit had been "calibrated two for two" was wrong.
              //
              // What survives that is the sibling comparison rather than the
              // ENOTFOUND itself: in each entry below the replacement was
              // observed responding in the SAME run that reported the original
              // missing, so the swap points at a host known to answer regardless
              // of whether the original was permanently or briefly unresolvable.
              // The itbpolice entry is stronger still, resting on spelling rather
              // than on reachability at all.
              //
              // Before adding an entry, check the host in a browser more than
              // once, minutes apart. Confirm the replacement loads too: ETIMEDOUT
              // proves a hostname resolves, not that the site serves anything.

              // ENOTFOUND on www; the apex timed out, so the apex resolves. 2 links.
              'www.nationalinsurance.nic.co.in': 'nationalinsurance.nic.co.in',

              // ENOTFOUND on the apex; www returned HTTP 403 — up, and merely
              // refusing this user-agent. The strongest of the three. 1 link.
              'coalindia.in': 'www.coalindia.in',

              // A typo, not a dead site: itbppolice has a doubled p. That
              // spelling is NXDOMAIN while itbpolice.nic.in timed out, so the
              // single-p host resolves. Flagged as a suspected typo on 25 Aug and
              // deliberately left alone then for want of evidence; the
              // full-coverage run supplied it. 1 link.
              'itbppolice.nic.in': 'itbpolice.nic.in',
            };

            const res = await fetch(`${apiUrl}/api/bot/exams`, {
              headers: { 'x-bot-api-key': botKey },
            });
            if (!res.ok) {
              core.setFailed(`Failed to fetch exams: ${res.status}`);
              return;
            }
            const data = await res.json();
            const exams = data.data || data;
            core.info(`Scanning ${exams.length} exams for ${Object.keys(REMAP).length} dead hostname(s)...`);

            // Rewrite the host only. A dead host does not make the path wrong,
            // and several of these point at a specific notice rather than the
            // site root.
            const remapUrl = (value) => {
              if (typeof value !== 'string' || !value.trim()) return null;
              let u;
              try { u = new URL(value.trim()); } catch { return null; }
              const replacement = REMAP[u.hostname.toLowerCase()];
              if (!replacement) return null;
              u.hostname = replacement;
              return u.href;
            };

            const payload = [];
            for (const e of exams) {
              const updates = {};
              for (const field of ['officialWebsite', 'applicationLink']) {
                const next = remapUrl(e[field]);
                if (next) updates[field] = next;
              }
              if (Object.keys(updates).length) {
                payload.push({
                  title: e.title,
                  category: e.category,
                  updates,
                  source: 'dead-domain-remap',
                });
                for (const [f, v] of Object.entries(updates)) {
                  core.info(`  ${e.title} [${f}]  ${e[f]}  ->  ${v}`);
                }
              }
            }

            if (payload.length === 0) {
              core.info('Nothing to remap — no exam references a listed dead hostname.');
              return;
            }

            core.info(`\n${payload.length} exam(s) to update. Applying...`);
            let updated = 0;
            let notFound = 0;
            for (let i = 0; i < payload.length; i += 50) {
              const batch = payload.slice(i, i + 50);
              const r = await fetch(`${apiUrl}/api/bot/bulk-update`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-bot-api-key': botKey },
                body: JSON.stringify({ exams: batch }),
              });
              if (!r.ok) {
                core.warning(`Batch ${Math.floor(i / 50) + 1} failed: ${r.status}`);
                continue;
              }
              const out = await r.json();
              const stats = out.data || {};
              updated += stats.updated || 0;
              for (const result of stats.results || []) {
                if (result.status === 'not_found') {
                  notFound++;
                  core.warning(`  not found in DB (title mismatch?): ${result.title}`);
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }

            core.info(`\n${'='.repeat(50)}`);
            core.info(`  Exams matched & updated : ${updated}`);
            core.info(`  Not found in database   : ${notFound}`);
            core.info(`${'='.repeat(50)}`);
            core.info('Re-run the Dead Official Link Audit to confirm these no longer appear.');
