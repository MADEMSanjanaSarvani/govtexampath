name: One-off - Remap Dead Official Domains

# Rewrites officialWebsite / applicationLink for hosts that are confirmed dead,
# where the same body serves the same content from a different domain. Only the
# hostname changes; path and query are preserved.
#
# THE BAR FOR ADDING AN ENTRY HERE IS DELIBERATELY HIGH.
#
# The Dead Official Link Audit reports far more unreachable hosts than belong in
# this table, and its first two reports were largely wrong — it called
# upsc.gov.in dead across 24 exams twice, once because of strict TLS and once
# because it counted a timeout as death. Rewriting a URL on that evidence would
# have replaced correct data with a guess, which is worse than the dead link.
# So an entry needs all three:
#
#   1. Unreachable from at least two independent networks, one of them a real
#      browser in India, since some government hosts refuse foreign traffic.
#   2. A failure that proves absence — no DNS, or connection refused. A timeout
#      does not qualify on its own; it has to be reproduced from India too.
#   3. The replacement demonstrably serving the same body's content, not a
#      plausible-looking guess.
#
# ssc.nic.in is the only host that has cleared it:
#   - dead-link audit from GitHub runners: ETIMEDOUT across 11 exam links
#   - official-source verifier from GitHub runners: ECONNABORTED
#   - Chrome in India: ERR_CONNECTION_TIMED_OUT
#   - ssc.gov.in is fetched successfully by the verifier on every run, and is
#     the host all 32 SSC links in the static catalogue already use, so the
#     replacement is what this project already treats as correct elsewhere
#     rather than something inferred here.
#
# INVESTIGATED AND REJECTED — do not add these without new evidence.
#
# The 26 Aug audit (the first to cover all 283 URLs) reported a railway cluster
# as unreachable: rrbapply.gov.in, rrbcdg.gov.in, indianrailways.gov.in and four
# of its subdomains, plus rlda.gov.in and rac.gov.in — over 20 exam links. It
# also reported tspsc.gov.in and www.tspsc.gov.in dead, 6 more.
#
# A cluster that size looks like one domain reorganisation with one obvious
# replacement, which is exactly why it is worth writing down that it is not.
# Requirement 3 above fails: there is no replacement this project already treats
# as correct. The hand-maintained static catalogue uses the same hosts the audit
# calls dead — www.rrbcdg.gov.in on 15 exams, www.rrbapply.gov.in on 1,
# tspsc.gov.in on 6, www.tspsc.gov.in on 2. Both catalogues agree, so this is not
# a case of the database holding stale URLs.
#
# RESOLVED — the railway cluster is not a data problem. rrbcdg.gov.in is the
# current, authoritative RRB Chandigarh site, actively publishing 2026 recruitment
# (CEN 06/2025, 02/2025, 03/2025, 05/2025, 09/2025). Its 25 links are correct and
# must not be rewritten. A browser in India reached it and got an F5 "Request
# Rejected" page, which is that WAF refusing one client rather than the site being
# down — the check came from an in-app browser, and F5 routinely rejects unusual
# user agents. So the audit's ECONNREFUSED here is a false positive of the same
# family as the timeouts it already quarantines, and the fix belongs in how the
# audit classifies it, not in the catalogue.
# tgpsc.gov.in exists and serves. The rename behind it is confirmed rather than
# inferred: Telangana changed its official abbreviation from TS to TG and its
# public bodies followed, so TSPSC became TGPSC with www.tgpsc.gov.in as the
# primary domain. The 8 tspsc.gov.in links are therefore pointing at a superseded
# domain, not suffering an outage — a different diagnosis from everything else in
# this report.
#
# RESOLVED — it is now in the table below. It was held out on 26 Aug for a real
# reason: the browser check then returned ERR_CERT_DATE_INVALID, and remapping to
# a site that greets every user with a full-page security warning would have been
# worse than leaving a link that fails quietly. A later check found it serving
# cleanly, so that objection is gone.
#
# The certificate error was transient, exactly as the isro.gov.in NXDOMAIN was —
# the third time in this investigation that a single observation proved
# unrepresentative. Worth carrying into the next report: an expired certificate is
# also precisely what makes an automated checker call a live site dead, the same
# failure class that made this audit's first report wrong across 153 URLs.
#
# That leaves two possibilities, and this job cannot tell them apart: the hosts
# are genuinely down, or an Indian government host is refusing a US-based GitHub
# runner. ECONNREFUSED is stronger than a timeout, but a firewall answering
# foreign traffic with a TCP RST produces the same signature. Requirement 1 —
# two independent networks, one a real browser in India — is what settles it.
#
# Until someone checks from India, remapping these would rewrite 20+ links on
# the say-so of a single vantage point, which is the mistake that made this
# audit's first three reports wrong.
#
# NOT A LINK PROBLEM — ofbindia.gov.in, reported ENOTFOUND for one exam,
# "Ordnance Factory Technician Apprentice 2026". There is no replacement to add
# because there is no Ordnance Factory Board: the Ministry of Defence dissolved it
# on 1 October 2021 and split its factories among seven separate companies —
# Munitions India, Armoured Vehicles Nigam, Advanced Weapons and Equipment India,
# Troop Comforts, Yantra India, India Optel and Gliders India — each recruiting
# through its own site. One dead hostname cannot be rewritten into seven.
#
# The link is not the defect. An exam dated 2026 is named after a body that
# stopped existing in 2021, so the entry itself needs a human decision: retire it,
# or replace it with whichever DPSU actually recruits the role. Neither is a
# hostname swap, so it stays out of this table. It is database-only — the static
# catalogue has no Ordnance Factory entry — and is the kind of finding the Full
# Data Audit exists to surface across the rest of the ~485 database exams.
#
# ALSO NOT BROKEN — ousssc.odisha.gov.in, reported ENOTFOUND for Odisha Police
# SI. It is the correct current site: the Odisha Uniformed Service Staff Selection
# Commission published the 7,664-post Constable and SI notification there on
# 10 June 2026, and applications run through it.
#
# This one is worth reading before adding any entry, because it nearly became a
# wrong remap. The report's timeout list contains osssc.gov.in, one character
# away, and the same one-character comparison that correctly identified
# itbppolice.nic.in as a doubled-p typo would have "fixed" ousssc into osssc.
# They are different bodies — the Uniformed Service commission and the
# Sub-ordinate Staff Selection Commission — so that swap would have pointed a
# police recruitment at the wrong organisation entirely.
#
# The lesson is narrow and worth keeping: near-identical hostnames are a reason
# to look, never a reason to act. itbpolice cleared because ITBP is Indo-Tibetan
# Border Police and the doubled p spells nothing; ousssc failed because the extra
# u stands for a real word that names a real, separate commission.
#
# ALSO NOT BROKEN — vizagsteel.com, reported ENOTFOUND for RINL Management
# Trainee. It is the current official site of Rashtriya Ispat Nigam Limited and
# was carrying 2026 recruitment when checked, including the Management Trainee
# route through GATE that this exam covers. Fourth false positive in the report.
#
# ALSO NOT BROKEN — tstet.cgg.gov.in, reported ENOTFOUND across 2 exams.
# Telangana's TS-to-TG rename makes a moved domain look likely here too, and it
# is not: tstet.cgg.gov.in remains the live TET portal. The 2026 information
# bulletin was published there from 14 Nov 2025 and applications were taken
# through it, so the host was serving weeks before the audit called it missing.
# That is a third confirmed false positive in this report alongside rrbcdg.gov.in
# and isro.gov.in, which is worth holding in mind when reading the next one: on
# the evidence so far, a single ENOTFOUND is likelier to be transient or
# vantage-specific than to mean a government portal has gone.

# Manual trigger only, and safe to run repeatedly — once a URL is remapped it no
# longer matches, so a second run reports nothing to do.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remap confirmed-dead hostnames
        uses: actions/github-script@v7
        env:
          API_URL: ${{ secrets.API_URL }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
        with:
          script: |
            const apiUrl = process.env.API_URL;
            const botKey = process.env.BOT_API_KEY;
            if (!apiUrl || !botKey) {
              core.setFailed('Missing API_URL or BOT_API_KEY');
              return;
            }

            // hostname -> replacement hostname. See the bar documented above.
            const REMAP = {
              'ssc.nic.in': 'ssc.gov.in',
              'www.ssc.nic.in': 'ssc.gov.in',

              // The three below come from comparing the 26 Aug audit against
              // itself. Each dead host has a sibling in the SAME report, checked
              // from the same runner at the same moment, that demonstrably
              // exists — so the comparison is internal evidence rather than an
              // outside guess, which is what the earlier wrong remaps lacked.
              //
              // ENOTFOUND IS NOT ALWAYS PERMANENT — read this before adding more.
              //
              // On 26 Aug a browser in India returned NXDOMAIN for both
              // tspsc.gov.in and isro.gov.in, matching the audit. Twenty-three
              // minutes later the same phone loaded isro.gov.in perfectly. The
              // DNS failure was transient, so an ENOTFOUND in one run is not
              // evidence a domain is gone, and an earlier version of this comment
              // claiming the audit had been "calibrated two for two" was wrong.
              //
              // What survives that is the sibling comparison rather than the
              // ENOTFOUND itself: in each entry below the replacement was
              // observed responding in the SAME run that reported the original
              // missing, so the swap points at a host known to answer regardless
              // of whether the original was permanently or briefly unresolvable.
              // The itbpolice entry is stronger still, resting on spelling rather
              // than on reachability at all.
              //
              // Before adding an entry, check the host in a browser more than
              // once, minutes apart. Confirm the replacement loads too: ETIMEDOUT
              // proves a hostname resolves, not that the site serves anything.

              // ENOTFOUND on www; the apex timed out, so the apex resolves. 2 links.
              'www.nationalinsurance.nic.co.in': 'nationalinsurance.nic.co.in',

              // ENOTFOUND on the apex; www returned HTTP 403 — up, and merely
              // refusing this user-agent. The strongest of the three. 1 link.
              'coalindia.in': 'www.coalindia.in',

              // A typo, not a dead site: itbppolice has a doubled p. That
              // spelling is NXDOMAIN while itbpolice.nic.in timed out, so the
              // single-p host resolves. Flagged as a suspected typo on 25 Aug and
              // deliberately left alone then for want of evidence; the
              // full-coverage run supplied it. 1 link.
              'itbppolice.nic.in': 'itbpolice.nic.in',

              // The clearest entry in this table after ssc.nic.in, and the only
              // other one meeting all three requirements outright.
              //
              // Madhya Pradesh reorganised the Professional Examination Board —
              // the body long known as Vyapam — into the Employees Selection
              // Board in 2022, and it publishes at esb.mp.gov.in. peb.mp.gov.in
              // is therefore a superseded domain rather than an outage, which is
              // why no amount of re-checking would have brought it back.
              //
              // Requirement 3 is satisfied twice over: esb.mp.gov.in is the
              // documented official site, and this catalogue already uses it for
              // one exam — the same "already treated as correct elsewhere" test
              // that made ssc.gov.in safe. The 26 Aug audit also reached it,
              // recording ETIMEDOUT, which means DNS resolved. 4 links.
              'peb.mp.gov.in': 'esb.mp.gov.in',
              'www.peb.mp.gov.in': 'esb.mp.gov.in',

              // The pair this audit was built around. The very first version of
              // dead-link-audit.yml named "gicofindia.com vs gicre.in" as the
              // example of a replacement not to guess at, and made the audit
              // read-only because of it. It is no longer a guess: General
              // Insurance Corporation trades as GIC Re and publishes at
              // gicre.in, which hosts its recruitment advertisements directly,
              // including the Assistant Manager and Scale I Officer notices these
              // two exams are about. gicofindia is the legacy domain. 2 links.
              'gicofindia.com': 'www.gicre.in',
              'www.gicofindia.com': 'www.gicre.in',

              // agricoop was the Department of Agriculture, Cooperation and
              // Farmers Welfare. Cooperation was carved out into its own ministry
              // in 2021 and the remainder became Agriculture and Farmers Welfare,
              // publishing at agriwelfare.gov.in — which is what stranded the old
              // hostname. The affected exam is NFSM Project Director; the National
              // Food Security Mission sits under that department, so the
              // replacement serves the same body. 1 link.
              'agricoop.nic.in': 'www.agriwelfare.gov.in',
              'www.agricoop.nic.in': 'www.agriwelfare.gov.in',

              // The largest remap here, and the one that took longest to justify.
              // Telangana changed its official abbreviation from TS to TG and its
              // public bodies followed, so TSPSC became TGPSC. The old hostname is
              // superseded rather than merely unreachable, which is why repeated
              // re-checks were never going to bring it back.
              //
              // Held out of this table on 26 Aug for a real reason: the browser
              // check then returned ERR_CERT_DATE_INVALID, and remapping to a site
              // that greets every user with a full-page security warning would
              // have been worse than leaving a link that fails quietly. A later
              // check found it serving cleanly — the commission's portal, with
              // OTR registration — so that objection is gone. Like the isro
              // NXDOMAIN before it, the certificate error was a moment in time
              // rather than a property of the site, which is the third time in
              // this investigation a single observation has proved unrepresentative.
              //
              // The apex is used here because that is the form verified loading.
              // 8 links, the biggest group in the report that was genuinely wrong.
              'tspsc.gov.in': 'tgpsc.gov.in',
              'www.tspsc.gov.in': 'tgpsc.gov.in',
            };

            const res = await fetch(`${apiUrl}/api/bot/exams`, {
              headers: { 'x-bot-api-key': botKey },
            });
            if (!res.ok) {
              core.setFailed(`Failed to fetch exams: ${res.status}`);
              return;
            }
            const data = await res.json();
            const exams = data.data || data;
            core.info(`Scanning ${exams.length} exams for ${Object.keys(REMAP).length} dead hostname(s)...`);

            // Rewrite the host only. A dead host does not make the path wrong,
            // and several of these point at a specific notice rather than the
            // site root.
            const remapUrl = (value) => {
              if (typeof value !== 'string' || !value.trim()) return null;
              let u;
              try { u = new URL(value.trim()); } catch { return null; }
              const replacement = REMAP[u.hostname.toLowerCase()];
              if (!replacement) return null;
              u.hostname = replacement;
              return u.href;
            };

            const payload = [];
            for (const e of exams) {
              const updates = {};
              for (const field of ['officialWebsite', 'applicationLink']) {
                const next = remapUrl(e[field]);
                if (next) updates[field] = next;
              }
              if (Object.keys(updates).length) {
                payload.push({
                  title: e.title,
                  category: e.category,
                  updates,
                  source: 'dead-domain-remap',
                });
                for (const [f, v] of Object.entries(updates)) {
                  core.info(`  ${e.title} [${f}]  ${e[f]}  ->  ${v}`);
                }
              }
            }

            if (payload.length === 0) {
              core.info('Nothing to remap — no exam references a listed dead hostname.');
              return;
            }

            core.info(`\n${payload.length} exam(s) to update. Applying...`);
            let updated = 0;
            let notFound = 0;
            for (let i = 0; i < payload.length; i += 50) {
              const batch = payload.slice(i, i + 50);
              const r = await fetch(`${apiUrl}/api/bot/bulk-update`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-bot-api-key': botKey },
                body: JSON.stringify({ exams: batch }),
              });
              if (!r.ok) {
                core.warning(`Batch ${Math.floor(i / 50) + 1} failed: ${r.status}`);
                continue;
              }
              const out = await r.json();
              const stats = out.data || {};
              updated += stats.updated || 0;
              for (const result of stats.results || []) {
                if (result.status === 'not_found') {
                  notFound++;
                  core.warning(`  not found in DB (title mismatch?): ${result.title}`);
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }

            core.info(`\n${'='.repeat(50)}`);
            core.info(`  Exams matched & updated : ${updated}`);
            core.info(`  Not found in database   : ${notFound}`);
            core.info(`${'='.repeat(50)}`);
            core.info('Re-run the Dead Official Link Audit to confirm these no longer appear.');
