name: Discover New Exam Notifications

# Scans two kinds of sources for exam notifications we don't have yet:
# (1) the official websites we already trust, one per conducting body, derived
#     from exams already on the site — deliberately not a hardcoded list of
#     guessed URLs.
# (2) third-party aggregators (freejobalert.com, sarkariresult.com) used ONLY
#     as a discovery signal for large-scale competitive exams (single-post/
#     contractual/guest-faculty/fellowship listings are explicitly excluded).
#     Anything spotted this way is never trusted from the aggregator page
#     itself — the backend follows it to its real official government source
#     and re-extracts from that page before creating anything.
# Real data only either way: the backend fetches each page directly and has
# Gemini extract structured fields from actual page text, not from memorized/
# guessed knowledge. Everything found is created inactive and queued in the
# existing admin verification dashboard (/admin/verification) for a human to
# approve before it goes live — new content is higher-risk than correcting a
# field on an exam that's already there, so nothing here reaches the public
# site unattended.

on:
  schedule:
    - cron: '0 4 * * *' # 9:30 AM IST daily
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many official sources to scan this run'
        required: false
        default: '15'
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Trigger discovery scan
        id: discover
        uses: actions/github-script@v7
        env:
          API_URL: ${{ secrets.API_URL }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '15' }}
        with:
          script: |
            const apiUrl = process.env.API_URL;
            const botKey = process.env.BOT_API_KEY;
            const limit = parseInt(process.env.LIMIT, 10) || 15;

            if (!apiUrl || !botKey) {
              core.warning('API_URL or BOT_API_KEY not configured — skipping.');
              core.setOutput('triggered', 'false');
              return;
            }

            // The backend responds immediately and keeps scanning in the
            // background (a full pass — official sources plus aggregator
            // sites, with AI verification per candidate — routinely takes
            // well past the ~5-minute timeout a plain fetch() enforces here,
            // which used to make this step report failure even though the
            // scan was completing fine server-side). So this step only
            // confirms the scan started; results show up in the admin
            // dashboard once it finishes, not in this log.
            core.info(`Triggering a scan of up to ${limit} sources for new exam notifications...`);
            try {
              const res = await fetch(`${apiUrl}/api/bot/discover-exams`, {
                method: 'POST',
                headers: { 'x-bot-api-key': botKey, 'Content-Type': 'application/json' },
                body: JSON.stringify({ limit }),
              });
              if (!res.ok) {
                core.warning(`Discovery API returned ${res.status}`);
                core.setOutput('triggered', 'false');
                return;
              }
              core.info('Scan started — it runs in the background and may take a while for a full pass.');
              core.setOutput('triggered', 'true');
            } catch (err) {
              core.warning(`Failed to trigger discovery: ${err.message}`);
              core.setOutput('triggered', 'false');
            }

      - name: Summary
        run: |
          echo "### New Exam Discovery" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.discover.outputs.triggered }}" = "true" ]; then
            echo "Scan **started** and is running in the background on the server — a full pass can take a while (fetching each source and AI-verifying every candidate against its real official source)." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the admin [Verification Dashboard](/admin/verification) in a few minutes for anything it found — new candidates appear inactive, pending your approval." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Failed to start the scan** — see the previous step's log for details." >> $GITHUB_STEP_SUMMARY
          fi
