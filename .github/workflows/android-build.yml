name: Build & Sign Android App

# Automatically builds and signs the Android app bundle (AAB) on every push to
# main, and uploads it as a downloadable artifact. If PLAY_SERVICE_ACCOUNT_JSON
# is configured as a secret, it also auto-uploads straight to Play Console's
# Internal testing track — no local Windows build/rebuild ever needed again.

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets and sync Android project
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://govtexampath-backend.onrender.com/api
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
        run: npm run cap:build

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify signing secrets are configured
        id: check-signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — building an UNSIGNED bundle. Add the keystore secrets to enable signed builds."
          fi

      - name: Decode signing keystore
        if: steps.check-signing.outputs.configured == 'true'
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Safe diagnostic: string length alone reveals nothing sensitive, but
          # tells us immediately if the secret was truncated during copy/paste
          # (a valid ~2.8KB keystore should base64-encode to ~3760 chars).
          echo "Received ANDROID_KEYSTORE_BASE64 secret: ${#KEYSTORE_BASE64} characters"

          # --ignore-garbage tolerates ANY non-base64-alphabet characters in the
          # input (stray whitespace, certutil-style header/footer lines, smart
          # quotes or other invisible characters picked up from copy-pasting)
          # by silently discarding them, rather than requiring one exact,
          # fragile generation/paste method from a non-technical user.
          echo "$KEYSTORE_BASE64" | base64 -d --ignore-garbage > app/ci-upload-keystore.jks

          # Fail loudly and clearly if the result isn't a plausible keystore,
          # rather than letting Gradle fail later with a cryptic signing error.
          size=$(wc -c < app/ci-upload-keystore.jks)
          echo "Decoded keystore: $size bytes"
          if [ "$size" -lt 500 ]; then
            echo "::error::Decoded keystore is only $size bytes — ANDROID_KEYSTORE_BASE64 secret does not contain a full, valid base64-encoded .jks file (likely truncated during copy/paste). Regenerate it with: [Convert]::ToBase64String([IO.File]::ReadAllBytes('govtexampath-upload.jks')) | Set-Clipboard  -- then paste directly into the GitHub secret field without editing."
            exit 1
          fi

      - name: Build release bundle (AAB)
        working-directory: frontend/android
        env:
          CI_KEYSTORE_PATH: ${{ steps.check-signing.outputs.configured == 'true' && 'ci-upload-keystore.jks' || '' }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CI_VERSION_CODE: ${{ github.run_number }}
          CI_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Remove keystore file from runner
        if: always()
        working-directory: frontend/android
        run: rm -f app/ci-upload-keystore.jks

      - name: Upload signed AAB as a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: govtexampath-release-${{ github.run_number }}
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Check if Play Console auto-upload is configured
        id: check-upload
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Safe diagnostic: length alone reveals nothing sensitive, but tells us whether the
          # runner actually received a non-empty PLAY_SERVICE_ACCOUNT_JSON secret at all — the
          # inline "${{ secrets.X }}" form used previously gave no visibility into this when the
          # upload step kept getting skipped despite the secret existing in the repo settings.
          echo "Received PLAY_SERVICE_ACCOUNT_JSON secret: ${#PLAY_JSON} characters"
          if [ -n "$PLAY_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON secret not set — skipping auto-upload. Download the build artifact above and upload it to Play Console manually, or add that secret to enable full auto-deploy."
          fi

      - name: Upload to Play Console (Internal testing)
        if: steps.check-upload.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.govtexampath.app
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Summary
        run: |
          echo "### Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Signed build | ${{ steps.check-signing.outputs.configured == 'true' && '✅ Signed' || '⚠️ Unsigned (add ANDROID_KEYSTORE_BASE64)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Play Console auto-upload | ${{ steps.check-upload.outputs.enabled == 'true' && '✅ Uploaded to Internal testing' || '⬇️ Not configured — download the artifact above and upload manually' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | 1.0.${{ github.run_number }} (code ${{ github.run_number }}) |" >> $GITHUB_STEP_SUMMARY
